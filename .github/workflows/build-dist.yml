name: Build dist branch

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: build-dist-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || github.event.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DIST_REF: dist/${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install production dependencies
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --no-plugins

      - name: Stamp plugin version with source commit
        run: |
          PLUGIN_FILE="$(php -r '
          foreach ( glob("*.php") as $file ) {
              $contents = file_get_contents($file);
              if ( preg_match("/^\\s*\\*\\s*Plugin Name:/mi", $contents) ) {
                  echo $file;
                  exit(0);
              }
          }
          fwrite(STDERR, "Could not find plugin main file.\n");
          exit(1);
          ')"
          SOURCE_COMMIT="$(git rev-parse --short=12 HEAD)"
          echo "PLUGIN_FILE=${PLUGIN_FILE}" >> "${GITHUB_ENV}"
          PLUGIN_FILE="${PLUGIN_FILE}" SOURCE_COMMIT="${SOURCE_COMMIT}" php -r '
          $path = getenv("PLUGIN_FILE");
          $contents = file_get_contents($path);
          $commit = getenv("SOURCE_COMMIT");
          $updated = preg_replace_callback(
              "/^(\\s*\\*\\s*Version:\\s*)([^\\r\\n]+)/mi",
              static function ( $matches ) use ( $commit ) {
                  $base_version = preg_replace("/\\+[0-9a-f]+$/i", "", trim($matches[2]));
                  return $matches[1] . $base_version . "+" . $commit;
              },
              $contents,
              1,
              $count
          );
          if ( 1 !== $count ) {
              fwrite(STDERR, "Could not find plugin Version header in {$path}.\n");
              exit(1);
          }
          file_put_contents($path, $updated);
          '

      - name: Point blueprints at dist branch
        run: |
          php -r '
          $dist_ref = getenv("DIST_REF");
          $repo_url = "https://github.com/" . getenv("GITHUB_REPOSITORY");
          foreach (["blueprint.json", "demo.json"] as $path) {
              if (!is_file($path)) {
                  continue;
              }
              $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              foreach ($data["steps"] as &$step) {
                  if (
                      ($step["step"] ?? null) === "installPlugin" &&
                      ($step["pluginData"]["resource"] ?? null) === "git:directory" &&
                      ($step["pluginData"]["url"] ?? null) === $repo_url &&
                      isset($step["pluginData"]["ref"])
                  ) {
                      $step["pluginData"]["ref"] = $dist_ref;
                  }
              }
              unset($step);
              file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          }
          '

      - name: Push to dist branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PLUGIN_FILE}"
          git add blueprint.json
          if [ -f demo.json ]; then
            git add demo.json
          fi
          if [ -d vendor ]; then
            git add -f vendor/
          fi
          git diff --cached --quiet || git commit -m "Build: add vendor"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/${DIST_REF} --force

  update-pr-description:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add Playground link to PR description
        uses: actions/github-script@v9
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const headRepo = process.env.HEAD_REPO;
            const headSha = process.env.HEAD_SHA;
            const [headOwner, headName] = headRepo.split('/');
            const pluginSource = { resource: 'git:directory', url: `https://github.com/${headRepo}`, ref: headSha, refType: 'commit' };
            const wpAppSource = { resource: 'git:directory', url: 'https://github.com/akirk/wp-app', ref: 'main', refType: 'branch', path: 'src' };
            const autoload = `<?php
            require_once __DIR__ . '/akirk/wp-app/functions.php';
            spl_autoload_register( static function ( $class ) {
                $map = [
                    'WpApp\\\\BaseApp' => 'abstract-baseapp.php',
                    'WpApp\\\\BaseStorage' => 'BaseStorage.php',
                    'WpApp\\\\Masterbar' => 'class-masterbar.php',
                    'WpApp\\\\Openstation' => 'class-openstation.php',
                    'WpApp\\\\Pwa' => 'class-pwa.php',
                    'WpApp\\\\Registry' => 'class-registry.php',
                    'WpApp\\\\Router' => 'class-router.php',
                    'WpApp\\\\Settings' => 'class-settings.php',
                    'WpApp\\\\WpApp' => 'class-wpapp.php',
                    'WpApp\\\\Rest\\\\Access' => 'rest/class-access.php',
                    'WpApp\\\\Rest\\\\Private_Posts_Controller' => 'rest/class-private-posts-controller.php',
                    'WpApp\\\\Rest\\\\Private_Terms_Controller' => 'rest/class-private-terms-controller.php',
                ];
                if ( isset( $map[ $class ] ) ) {
                    require_once __DIR__ . '/akirk/wp-app/' . $map[ $class ];
                }
            } );
            `;
            const cleanup = `<?php require '/wordpress/wp-load.php'; require_once ABSPATH . 'wp-admin/includes/plugin.php'; $old = 'travel-app/travel-app.php'; if ( file_exists( WP_PLUGIN_DIR . '/' . $old ) ) { deactivate_plugins( $old ); $it = new RecursiveIteratorIterator( new RecursiveDirectoryIterator( WP_PLUGIN_DIR . '/travel-app', FilesystemIterator::SKIP_DOTS ), RecursiveIteratorIterator::CHILD_FIRST ); foreach ( $it as $f ) { $f->isDir() ? rmdir( $f ) : unlink( $f ); } rmdir( WP_PLUGIN_DIR . '/travel-app' ); }`;
            const blueprint = {
              $schema: 'https://playground.wordpress.net/blueprint-schema.json',
              landingPage: '/traveler/',
              login: true,
              steps: [
                { step: 'installPlugin', pluginData: pluginSource, options: { activate: false, targetFolderName: 'traveler' } },
                { step: 'installPlugin', pluginData: wpAppSource, options: { activate: false, targetFolderName: 'traveler/vendor/akirk/wp-app' } },
                { step: 'mkdir', path: 'wordpress/wp-content/plugins/traveler/vendor' },
                { step: 'writeFile', path: '/wordpress/wp-content/plugins/traveler/vendor/autoload.php', data: autoload },
                { step: 'activatePlugin', pluginPath: 'traveler/traveler.php' },
                { step: 'runPHP', code: cleanup },
              ],
            };
            const playgroundUrl = (data) => `https://playground.wordpress.net/#${encodeURIComponent(JSON.stringify(data))}`;
            const links = [`[Try this PR](${playgroundUrl(blueprint)})`];

            try {
              const demoResponse = await github.rest.repos.getContent({
                owner: headOwner,
                repo: headName,
                path: 'demo.json',
                ref: headSha,
              });

              if (!Array.isArray(demoResponse.data) && demoResponse.data.type === 'file' && demoResponse.data.content) {
                const demo = JSON.parse(Buffer.from(demoResponse.data.content, demoResponse.data.encoding || 'base64').toString('utf8'));
                const demoSteps = (demo.steps || []).filter((step) => step.step !== 'installPlugin');
                if (demoSteps.length) {
                  const demoBlueprint = JSON.parse(JSON.stringify(blueprint));
                  demoBlueprint.steps.push(...demoSteps);
                  links.push(`[Try with demo data](${playgroundUrl(demoBlueprint)})`);
                }
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const markerStart = '<!-- playground-link:start -->';
            const markerEnd = '<!-- playground-link:end -->';
            const playgroundSection = [
              markerStart,
              '## WordPress Playground',
              '',
              `Test this PR in WordPress Playground: ${links.join(' · ')}`,
              '',
              `The linked blueprint installs this PR directly from \`${headRepo}@${headSha.slice(0, 12)}\` and loads WpApp from \`akirk/wp-app\`.`,
              markerEnd,
            ].join('\n');

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const currentBody = context.payload.pull_request.body || '';
            // Matches any current or historical marker in this family (e.g. a stale
            // "demo-playground-link" block from before links were consolidated), so
            // every run leaves exactly one section behind, however many existed before.
            const existingSections = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/g;
            const withoutSections = currentBody.replace(existingSections, '').replace(/\n{3,}/g, '\n\n').trim();
            const body = [withoutSections, playgroundSection].filter(Boolean).join('\n\n');

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number,
              body,
            });
